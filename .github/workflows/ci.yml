name: MLops CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Unit Tests
      run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # -----------------------------
    # Login to Docker Hub
    # -----------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    # -----------------------------
    # Build Image
    # -----------------------------
    - name: Build Docker Image
      run: docker build -t 2024aa05078/cat-dog-classifier:latest .

    # -----------------------------
    # Push Image to Docker Hub  ⭐ THIS WAS MISSING
    # -----------------------------
    - name: Push Docker Image
      run: docker push 2024aa05078/cat-dog-classifier:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Pull Docker Image
      run: docker pull 2024aa05078/cat-dog-classifier:latest

    - name: Stop Old Container (if exists)
      run: |
        docker stop catdog || true
        docker rm catdog || true

    - name: Run New Container
      run: |
        docker run -d -p 8000:8000 --name catdog 2024aa05078/cat-dog-classifier:latest

    - name: Check Running Containers
      run: docker ps

    # -----------------------------
    # Run Smoke Tests (POST-DEPLOY)
    # -----------------------------
    - name: Smoke Test (Skipped in CI)
      if: ${{ false }}
      run: python deployment/smoke_test.py
